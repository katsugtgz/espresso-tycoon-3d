<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="gr-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140a05" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#140a05" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gr-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="40%" stop-color="#718096" />
      <stop offset="70%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="gr-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="gr-hopper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <!-- Shadow Base -->
  <ellipse cx="64" cy="116" rx="42" ry="7" fill="url(#gr-shadow)" />

  <!-- Base Plate & Rubber Feet -->
  <rect x="42" y="108" width="44" height="6" rx="2" fill="#1e293b" />
  <rect x="44" y="105" width="40" height="4" fill="#334155" />

  <!-- Main Machine Body (Angled Sleek Precision Tower) -->
  <path d="M 46 54 L 82 54 L 78 106 L 50 106 Z" fill="url(#gr-metal)" />
  <!-- Body Highlight Edge -->
  <path d="M 48 56 L 52 104" stroke="#ffffff" stroke-width="1.2" opacity="0.35" />

  <!-- Hopper Lid (Brushed Metal) -->
  <ellipse cx="64" cy="14" rx="20" ry="4" fill="url(#gr-metal)" />
  <ellipse cx="64" cy="12" rx="6" ry="2" fill="#94a3b8" />

  <!-- Clear Bean Hopper (Top Funnel) -->
  <path d="M 44 14 L 84 14 L 74 42 L 54 42 Z" fill="url(#gr-hopper)" stroke="#cbd5e1" stroke-width="1" />
  
  <!-- Coffee Beans Inside Hopper -->
  <g fill="#451a03" stroke="#270e02" stroke-width="0.5">
    <ellipse cx="58" cy="28" rx="4" ry="2.5" transform="rotate(-20 58 28)" />
    <ellipse cx="68" cy="27" rx="3.8" ry="2.3" transform="rotate(25 68 27)" />
    <ellipse cx="62" cy="35" rx="3.5" ry="2.2" transform="rotate(10 62 35)" />
    <ellipse cx="55" cy="36" rx="3.2" ry="2" transform="rotate(-35 55 36)" />
    <ellipse cx="71" cy="34" rx="3.5" ry="2.2" transform="rotate(-15 71 34)" />
    <ellipse cx="64" cy="22" rx="4" ry="2.5" transform="rotate(40 64 22)" />
  </g>
  <!-- Hopper Front Shine -->
  <path d="M 48 16 L 56 40" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />

  <!-- Stepped Collar Adjustment Ring (Burr Dial) -->
  <rect x="50" y="42" width="28" height="8" rx="1.5" fill="url(#gr-gold)" />
  <!-- Dial Notches -->
  <g stroke="#713f12" stroke-width="1">
    <line x1="54" y1="44" x2="54" y2="48" />
    <line x1="58" y1="43" x2="58" y2="49" />
    <line x1="62" y1="44" x2="62" y2="48" />
    <line x1="64" y1="43" x2="64" y2="49" stroke-width="1.4" stroke="#451a03" />
    <line x1="66" y1="44" x2="66" y2="48" />
    <line x1="70" y1="43" x2="70" y2="49" />
    <line x1="74" y1="44" x2="74" y2="48" />
  </g>

  <!-- Digital Power Display / Touch Panel -->
  <rect x="54" y="60" width="20" height="12" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="64" y="69" font-family="monospace" font-size="7" font-weight="bold" fill="#38bdf8" text-anchor="middle">18.5s</text>

  <!-- Dispensing Chute (Snout) -->
  <path d="M 60 76 L 68 76 L 66 84 L 62 84 Z" fill="url(#gr-gold)" />

  <!-- Portafilter Forks / Ground Grounds Container -->
  <path d="M 52 88 L 76 88 L 73 103 L 55 103 Z" fill="#334155" stroke="#475569" stroke-width="1" />
  <ellipse cx="64" cy="88" rx="12" ry="3" fill="#1e293b" />
  <ellipse cx="64" cy="89" rx="10" ry="2" fill="#3d1d09" />

  <!-- Fork prongs -->
  <rect x="49" y="90" width="4" height="2" rx="0.5" fill="#94a3b8" />
  <rect x="75" y="90" width="4" height="2" rx="0.5" fill="#94a3b8" />

  <!-- Machine Side Accent / Power Switch -->
  <circle cx="79" cy="74" r="2.5" fill="url(#gr-gold)" />
</svg>
