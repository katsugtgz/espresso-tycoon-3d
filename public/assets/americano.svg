<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="am-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140a05" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#140a05" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="am-mug" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="35%" stop-color="#2d3748" />
      <stop offset="70%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#10151f" />
    </linearGradient>
    <linearGradient id="am-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#718096" />
      <stop offset="50%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#2d3748" />
    </linearGradient>
    <radialGradient id="am-coffee" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#3d2112" />
      <stop offset="65%" stop-color="#210f08" />
      <stop offset="90%" stop-color="#110703" />
      <stop offset="100%" stop-color="#050201" />
    </radialGradient>
  </defs>

  <!-- Shadow Base -->
  <ellipse cx="58" cy="114" rx="38" ry="8" fill="url(#am-shadow)" />

  <!-- Mug Handle -->
  <path d="M 80 58 C 110 58, 110 94, 78 98" fill="none" stroke="url(#am-mug)" stroke-width="8" stroke-linecap="round" />
  <path d="M 80 58 C 106 58, 106 94, 78 98" fill="none" stroke="#4a5568" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- Mug Body -->
  <path d="M 32 48 L 38 104 Q 40 110, 58 110 Q 76 110, 78 104 L 84 48 Z" fill="url(#am-mug)" />
  
  <!-- Mug Left Side Highlight Stripe -->
  <path d="M 37 52 L 42 103 C 40 98, 38 85, 36 55 Z" fill="#ffffff" opacity="0.18" />

  <!-- Mug Rim -->
  <ellipse cx="58" cy="48" rx="26" ry="7.5" fill="url(#am-rim)" />
  <ellipse cx="58" cy="48" rx="24" ry="6.5" fill="#181e26" />

  <!-- Black Coffee Surface -->
  <ellipse cx="58" cy="49" rx="23" ry="5.8" fill="url(#am-coffee)" />

  <!-- Liquid Surface Glint -->
  <path d="M 46 47.5 C 50 46.5, 60 46.5, 66 47.5 C 60 47, 52 47, 46 47.5 Z" fill="#b08968" opacity="0.6" />
  <ellipse cx="64" cy="50" rx="3" ry="1.2" fill="#d4a373" opacity="0.4" />

  <!-- Sleek Mug Base Trim -->
  <path d="M 40 106 Q 58 112 76 106" fill="none" stroke="#2b1a11" stroke-width="2.5" />

  <!-- Rising Steam -->
  <g opacity="0.75" stroke="#e2e8f0" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M 50 36 C 45 26, 54 18, 48 10" />
    <path d="M 60 34 C 66 24, 58 16, 64 8" stroke-width="2.6" />
    <path d="M 70 37 C 74 29, 68 22, 72 14" opacity="0.6" />
  </g>
</svg>
