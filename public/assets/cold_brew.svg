<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="cb-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140a05" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#140a05" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cb-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8661b" />
      <stop offset="40%" stop-color="#73330c" />
      <stop offset="85%" stop-color="#3d1504" />
      <stop offset="100%" stop-color="#1b0801" />
    </linearGradient>
    <linearGradient id="cb-ice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#e8f4f8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#bfe3f0" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="straw-stripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d93829" />
      <stop offset="100%" stop-color="#a81c0f" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="64" cy="116" rx="34" ry="7" fill="url(#cb-shadow)" />

  <!-- Straw (Back segment sticking out) -->
  <g transform="rotate(18 64 64)">
    <!-- Main Straw Cylinder -->
    <rect x="72" y="10" width="7" height="65" rx="3.5" fill="#f8f9fa" />
    <!-- Diagonal Stripes -->
    <path d="M 72 16 L 79 21 L 79 26 L 72 21 Z" fill="url(#straw-stripe)" />
    <path d="M 72 28 L 79 33 L 79 38 L 72 33 Z" fill="url(#straw-stripe)" />
    <path d="M 72 40 L 79 45 L 79 50 L 72 45 Z" fill="url(#straw-stripe)" />
    <path d="M 72 52 L 79 57 L 79 62 L 72 57 Z" fill="url(#straw-stripe)" />
    <path d="M 72 64 L 79 69 L 79 74 L 72 69 Z" fill="url(#straw-stripe)" />
  </g>

  <!-- Drink Liquid & Ice Interior (Clipped) -->
  <clipPath id="cb-glass-clip">
    <path d="M 38 42 L 44 108 Q 45 112, 64 112 Q 83 112, 84 108 L 90 42 Z" />
  </clipPath>

  <g clip-path="url(#cb-glass-clip)">
    <!-- Cold Brew Dark Amber Liquid -->
    <rect x="30" y="46" width="68" height="70" fill="url(#cb-amber)" />

    <!-- Ice Cubes submerged / floating -->
    <!-- Ice Cube 1 (Left) -->
    <g transform="translate(43, 50) rotate(12)">
      <polygon points="0,6 10,0 22,5 12,12" fill="url(#cb-ice)" stroke="#ffffff" stroke-width="0.8" />
      <polygon points="0,6 12,12 12,24 0,18" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="0.8" />
      <polygon points="12,12 22,5 22,17 12,24" fill="#6ba4b8" fill-opacity="0.3" stroke="#ffffff" stroke-width="0.8" />
    </g>

    <!-- Ice Cube 2 (Right) -->
    <g transform="translate(62, 54) rotate(-15)">
      <polygon points="0,5 9,0 20,4 11,10" fill="url(#cb-ice)" stroke="#ffffff" stroke-width="0.8" />
      <polygon points="0,5 11,10 11,21 0,16" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="0.8" />
      <polygon points="11,10 20,4 20,15 11,21" fill="#6ba4b8" fill-opacity="0.3" stroke="#ffffff" stroke-width="0.8" />
    </g>

    <!-- Ice Cube 3 (Center submerged) -->
    <g transform="translate(52, 70) rotate(22)" opacity="0.6">
      <polygon points="0,5 8,0 18,4 10,10" fill="url(#cb-ice)" stroke="#ffffff" stroke-width="0.7" />
      <polygon points="0,5 10,10 10,19 0,14" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="0.7" />
      <polygon points="10,10 18,4 18,13 10,19" fill="#2d1509" fill-opacity="0.4" stroke="#ffffff" stroke-width="0.7" />
    </g>

    <!-- Liquid Top Meniscus -->
    <ellipse cx="64" cy="48" rx="25" ry="5.5" fill="#d97a29" opacity="0.7" />
    <ellipse cx="64" cy="48" rx="23" ry="4.5" fill="#80380a" />
  </g>

  <!-- Ribbed / Fluted Glass Tumbler Overlay -->
  <path d="M 38 42 L 44 108 Q 45 112, 64 112 Q 83 112, 84 108 L 90 42 Z" fill="#ffffff" fill-opacity="0.08" stroke="#d5e8f2" stroke-width="1.4" />

  <!-- Vertical Ribbed Facet Lines -->
  <g stroke="#ffffff" stroke-width="1.2" opacity="0.45">
    <line x1="45" y1="44" x2="49" y2="108" />
    <line x1="53" y1="44" x2="55" y2="110" />
    <line x1="61" y1="44" x2="62" y2="111" />
    <line x1="67" y1="44" x2="66" y2="111" />
    <line x1="75" y1="44" x2="73" y2="110" />
    <line x1="83" y1="44" x2="79" y2="108" />
  </g>

  <!-- Heavy Glass Base -->
  <path d="M 43 103 L 44 108 Q 45 112, 64 112 Q 83 112, 84 108 L 85 103 Q 64 107, 43 103 Z" fill="#eaf2f8" opacity="0.75" />

  <!-- Tumbler Rim -->
  <ellipse cx="64" cy="42" rx="26" ry="6.5" fill="none" stroke="#e1eef5" stroke-width="1.8" />
  <ellipse cx="64" cy="42" rx="24.5" ry="5.5" fill="#ffffff" opacity="0.2" />

  <!-- Condensation Droplets -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="43" cy="65" r="1.4" />
    <circle cx="44" cy="80" r="1.2" />
    <circle cx="43.5" cy="83" r="0.8" />
    <circle cx="82" cy="72" r="1.3" />
    <circle cx="83.5" cy="88" r="1.1" />
    <circle cx="70" cy="98" r="1.2" />
    <circle cx="56" cy="92" r="1.2" />
    <circle cx="58" cy="96" r="0.7" />
  </g>

  <!-- Left Gloss Highlight -->
  <path d="M 40 45 L 45 105" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
</svg>
