<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="mo-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140a05" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#140a05" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mo-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="mo-choco" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d1e0d" />
      <stop offset="100%" stop-color="#1c0b03" />
    </linearGradient>
    <linearGradient id="mo-coffee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#805128" />
      <stop offset="100%" stop-color="#46250f" />
    </linearGradient>
    <linearGradient id="mo-cream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#fff8f0" />
      <stop offset="100%" stop-color="#eddcd0" />
    </linearGradient>
  </defs>

  <!-- Shadow Base -->
  <ellipse cx="60" cy="116" rx="34" ry="7" fill="url(#mo-shadow)" />

  <!-- Glass Mug Handle -->
  <path d="M 76 64 C 98 64, 98 92, 74 94" fill="none" stroke="#e0e8f0" stroke-width="6" stroke-linecap="round" opacity="0.75" />
  <path d="M 76 64 C 96 64, 96 92, 74 94" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <!-- Glass Foot & Base -->
  <ellipse cx="58" cy="111" rx="20" ry="4.5" fill="#cad5e0" opacity="0.6" />
  <rect x="54" y="104" width="8" height="7" rx="2" fill="#d2dde8" opacity="0.7" />

  <!-- Drink Interior Layers (Clipped to glass shape) -->
  <g>
    <clipPath id="mo-glass-clip">
      <path d="M 36 50 L 42 104 Q 43 106, 58 106 Q 73 106, 74 104 L 80 50 Z" />
    </clipPath>

    <g clip-path="url(#mo-glass-clip)">
      <!-- Layer 1: Bottom Dark Chocolate Syrup -->
      <rect x="30" y="88" width="60" height="20" fill="url(#mo-choco)" />
      <!-- Chocolate drips / blend curve -->
      <path d="M 36 88 Q 45 84, 52 89 Q 62 93, 72 87 L 76 89 L 76 96 L 36 96 Z" fill="url(#mo-choco)" />

      <!-- Layer 2: Rich Coffee / Espresso Layer -->
      <rect x="30" y="68" width="60" height="22" fill="url(#mo-coffee)" />

      <!-- Layer 3: Milk & Coffee Swirl Transition -->
      <rect x="30" y="48" width="60" height="22" fill="#c49b74" />
      <path d="M 36 68 Q 48 72, 60 67 Q 70 63, 78 69 L 78 72 L 36 72 Z" fill="#996a40" />
    </g>
  </g>

  <!-- Glass Outer Body -->
  <path d="M 36 50 L 42 104 Q 43 106, 58 106 Q 73 106, 74 104 L 80 50 Z" fill="url(#mo-glass)" stroke="#cadbe8" stroke-width="1.2" opacity="0.8" />
  
  <!-- Glass Reflections -->
  <path d="M 39 52 L 44 101 C 42 96, 40 85, 38 54 Z" fill="#ffffff" opacity="0.4" />
  <path d="M 77 52 L 73 101" stroke="#ffffff" stroke-width="1" opacity="0.3" />

  <!-- Glass Rim -->
  <ellipse cx="58" cy="50" rx="22" ry="5.5" fill="none" stroke="#e1ebf5" stroke-width="1.5" />

  <!-- Whipped Cream Swirl Dome -->
  <g id="whipped-cream">
    <!-- Base cream mound -->
    <path d="M 36 52 C 34 44, 42 38, 50 39 C 52 33, 62 31, 68 35 C 76 34, 82 42, 80 52 Z" fill="url(#mo-cream)" />
    
    <!-- Secondary swirl tier -->
    <path d="M 43 43 C 44 33, 56 30, 62 31 C 70 30, 74 37, 72 44 Z" fill="#ffffff" />

    <!-- Peak swirl tip -->
    <path d="M 52 34 C 52 24, 64 22, 61 17 C 58 24, 66 26, 64 34 Z" fill="#ffffff" />

    <!-- Cream folds shading -->
    <path d="M 45 46 Q 52 42, 59 47" fill="none" stroke="#e0cdbe" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 61 41 Q 68 38, 73 44" fill="none" stroke="#e0cdbe" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 54 33 Q 60 30, 62 36" fill="none" stroke="#e0cdbe" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Chocolate Syrup Drizzle on Whipped Cream -->
  <path d="M 40 46 Q 48 38, 56 46 Q 66 38, 76 45" fill="none" stroke="#3b190a" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 47 38 Q 58 32, 66 40" fill="none" stroke="#3b190a" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 54 28 Q 61 24, 63 31" fill="none" stroke="#3b190a" stroke-width="2" stroke-linecap="round" />

  <!-- Chocolate Shavings / Curls -->
  <rect x="49" y="34" width="3" height="1.8" rx="0.8" fill="#240e05" transform="rotate(25 49 34)" />
  <rect x="65" y="36" width="3.2" height="1.8" rx="0.8" fill="#240e05" transform="rotate(-30 65 36)" />
  <rect x="58" y="24" width="2.5" height="1.5" rx="0.7" fill="#240e05" transform="rotate(15 58 24)" />
</svg>
