<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="es-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140a05" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#140a05" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="es-cup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#ece6e0" />
      <stop offset="100%" stop-color="#cfc2b6" />
    </linearGradient>
    <radialGradient id="es-crema" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#e8a85a" />
      <stop offset="40%" stop-color="#b67129" />
      <stop offset="80%" stop-color="#5a2f0e" />
      <stop offset="100%" stop-color="#2a1204" />
    </radialGradient>
    <linearGradient id="es-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf4d0" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a710e" />
    </linearGradient>
  </defs>

  <!-- Shadow Base -->
  <ellipse cx="64" cy="112" rx="46" ry="10" fill="url(#es-shadow)" />

  <!-- Saucer -->
  <g id="saucer">
    <!-- Saucer underside -->
    <ellipse cx="64" cy="104" rx="44" ry="11" fill="#b9ab9c" />
    <!-- Saucer body -->
    <ellipse cx="64" cy="102" rx="44" ry="10.5" fill="url(#es-cup)" />
    <!-- Saucer gold accent ring -->
    <ellipse cx="64" cy="102" rx="35" ry="7.5" fill="none" stroke="url(#es-gold)" stroke-width="1.2" opacity="0.8" />
    <!-- Saucer center indentation -->
    <ellipse cx="64" cy="102.5" rx="27" ry="5.5" fill="#ded4c8" />
  </g>

  <!-- Cup Handle -->
  <path d="M 82 66 C 104 66, 104 90, 80 92" fill="none" stroke="url(#es-cup)" stroke-width="7" stroke-linecap="round" />
  <path d="M 82 66 C 102 66, 102 90, 80 92" fill="none" stroke="#f7f5f2" stroke-width="4" stroke-linecap="round" />

  <!-- Cup Body -->
  <path d="M 36 60 Q 38 98 52 102 Q 64 104 76 102 Q 90 98 92 60 Z" fill="url(#es-cup)" stroke="#c4b6a8" stroke-width="1" />
  <!-- Gloss highlight on left -->
  <path d="M 41 64 C 42 85, 48 96, 54 99 C 48 94, 44 82, 44 64 Z" fill="#ffffff" opacity="0.65" />

  <!-- Cup Rim -->
  <ellipse cx="64" cy="60" rx="28" ry="8.5" fill="#ffffff" stroke="#c4b6a8" stroke-width="1" />
  
  <!-- Crema Surface -->
  <ellipse cx="64" cy="61" rx="25.5" ry="7" fill="url(#es-crema)" />

  <!-- Golden Crema Swirl & Heart -->
  <path d="M 54 60.5 C 57 58, 64 58, 71 61 C 74 62.5, 71 64, 65 63 C 58 62, 53 61.5, 54 60.5 Z" fill="#f5ce8c" opacity="0.8" />
  <ellipse cx="64" cy="61" rx="4" ry="2.2" fill="#fff5de" opacity="0.9" />
  <path d="M 64 59 Q 62 62 64 63.5 Q 66 62 64 59" fill="#9c561b" />

  <!-- Rising Steam -->
  <g opacity="0.75" stroke="#e0cbbe" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M 57 48 C 53 38, 60 30, 56 20" />
    <path d="M 67 46 C 72 36, 64 27, 70 18" stroke="#f0e2d7" stroke-width="2.5" />
  </g>
</svg>
